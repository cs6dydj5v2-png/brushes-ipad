name: Crear IPA offline de Seda
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Extraer proyecto Seda
        run: unzip -q Seda-iOS12-fuentes.zip -d seda-source
      - name: Compilar app para iOS 12
        run: bash seda-source/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Seda-ios12-unsigned
          path: seda-source/build/Seda-ios12-unsigned.ipa
          if-no-files-found: error
